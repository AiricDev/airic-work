name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix backend
      - run: npm run check
      - run: docker build -t airic-work:task .
      - run: python3 backend/tests/deploy/smoke.py
      - name: Publish tested Task Worker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag airic-work:task "$image:$GITHUB_SHA"
          docker tag airic-work:task "$image:task"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:task"
