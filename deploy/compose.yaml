services:
  airic-work:
    image: &worker-image ${AIRIC_IMAGE:-ghcr.io/airicdev/airic-work:task}
    init: true
    user: "${AIRIC_DEPLOY_UID:?Set this value in .env}:${AIRIC_DEPLOY_GID:?Set this value in .env}"
    env_file: .env
    environment:
      AIRIC_WORKSPACE_IMAGE: *worker-image
      AIRIC_WORKSPACE_HOST_DATA: ${AIRIC_DEPLOY_DATA:?Set this value in .env}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ${AIRIC_DEPLOY_DATA:?Set the absolute data directory in .env}:/var/lib/airic-work
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: "${AIRIC_OM_REPOSITORY:?Set the absolute path to the local OM Git repository}"
        target: /om
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    group_add:
      - ${AIRIC_DOCKER_SOCKET_GID:-0}
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
