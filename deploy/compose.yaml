services:
  airic-work:
    image: airic-work:task
    build:
      context: ..
    init: true
    user: "${AIRIC_DEPLOY_UID:?Use deploy/up.mjs}:${AIRIC_DEPLOY_GID:?Use deploy/up.mjs}"
    env_file: .env.task
    environment:
      AIRIC_OM_REPOSITORY: ${AIRIC_OM_REPOSITORY:?Set an absolute Git path or URL}
      AIRIC_WORKSPACE_HOST_DATA: ${AIRIC_DEPLOY_DATA:?Use deploy/up.mjs}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./data:/var/lib/airic-work
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${AIRIC_DEPLOY_OM_MOUNT:?Use deploy/up.mjs}:/om:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    group_add:
      - ${AIRIC_DOCKER_SOCKET_GID:-0}
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
